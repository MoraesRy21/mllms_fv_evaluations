experiment:
  name: "FLC_Zero_Shot_Evaluation"
  description: "Evaluation of foundation models as a validation committee for facial biometrics."
  subset_size: 1000 # The size of subset

paths:
  # Path to the binary file generated by your Phase 1 (using FacePairGenerator)
#  bin_subset: "results/pairs/face_eval_bin_pair-gt_labat-cropped_image-resized-112x112-len1180.bin" # Alias paper - FCR112-PAIR-SET
  bin_subset: "results/pairs/face_eval_bin_pair-gt_labat-full_image-default_480x640-len1180.bin" # Alias paper - FFIDR-PAIR-SET
  pair_images_dir: "results/pairs/images"

  results_dir: "results/flc_evaluation/"
  plot_dir: "results/flc_evaluation/plots"
  logs_dir: "results/flc_evaluation/logs"

  all_aggregations_dir: "results/flc_fv_aggregation"
  all_aggregations_plot_dir: "results/flc_fv_aggregation/plots"

prompting:
  system_instruction: >
    Você é um sistema especialista em biometria forense e segurança de identidade em transportes públicos.
  user_prompt: >
    Analise estas duas imagens de rostos. A primeira imagem é a foto de referência do documento de identidade. 
    A segunda imagem é uma captura de câmera de segurança dentro do ônibus.
    Sua tarefa é verificar se as duas imagens pertencem à exata mesma pessoa física.
    
    Retorne IMEDIATAMENTE e APENAS o JSON. Não inclua reflexões, saudações, introduções ou marcadores markdown (```). A sua resposta DEVE começar com o caractere { e terminar com o caractere }.
    
    As chaves do JSON são obrigatoriamente:
    - "fraude": booleano (true se as imagens forem de pessoas DIFERENTES; false se forem da MESMA pessoa).
    - "confianca": float (de 0.0 a 1.0 indicando o grau de certeza).
    - "justificativa": string (MÁXIMO DE 30 PALAVRAS. Vá direto ao ponto, por exemplo: "Formatos do nariz e queixo divergem" ou "Traços faciais totalmente correspondentes").
    - "similaridade": float (de 0.0 a 1.0 indicando a similaridade entre as duas imagens).

models:
  gemini:
    model_name: "gemini-2.5-flash" # Faster and cheaper model on Gemini
    temperature: 0.0 # It is essential to keep this at 0 for closed classification tasks.
    max_output_tokens: 4000 # Short limit to lower request costs and avoid verbose responses.
    delay_time_between_response: 0.5
    api_key: ""

  openai:
    model_name: "gpt-4o-mini" # Faster and cheaper model on OpenAI
    temperature: 0.0
    max_output_tokens: 1000
    delay_time_between_response: 0.5
    api_key: ""

  anthropic:
    model_name: "claude-haiku-4-5-20251001" # Faster and cheaper model on Anthropic
    temperature: 0.0
    max_output_tokens: 1000
    delay_time_between_response: 0.5
    api_key: ""